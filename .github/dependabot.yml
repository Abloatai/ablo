# Public SDK dependency automation is security-only.
# Routine version-update PRs are disabled for every ecosystem with a zero limit.
# Grouped security updates remain enabled through the repository's Dependabot
# security-update setting and keep their separate GitHub-managed PR limit.
# Schedules are required configuration; they do not delay security updates.
#
# Reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/resource-adapter/runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  # Security updates only.
  - package-ecosystem: npm
    directories:
      - /docs/ablo
      - /examples/account-multiplayer
      - /packages/cli/evals/fixtures/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      npm-security-other:
        applies-to: security-updates
        patterns: ["*"]
