name: Change evidence

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI, verify, Verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request to reconcile
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  evidence:
    name: Reconcile change evidence
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Always execute trusted default-branch code, never the PR's code or scripts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify current-head evidence
        uses: ./scripts/compliance/github-changes
        with:
          pull-request: ${{ inputs.pull_request }}
