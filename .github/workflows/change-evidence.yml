name: Change evidence

on:
  # Release PRs and hotfixes into main only; PRs into dev need no evidence.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Release check]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request to reconcile
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  evidence:
    name: Reconcile change evidence
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Always execute trusted default-branch code, never the PR's code or scripts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify current-head evidence
        uses: ./scripts/compliance/github-changes
        with:
          pull-request: ${{ inputs.pull_request }}
