# Docker Compose for sync engine E2E tests: PostgreSQL + Redis.
#
# No sync server is booted here. The Rust server's image
# (experiments/rust-sync/full-server/Dockerfile) builds from a private ECR
# bootstrap stage and has no header-authenticated test mode, so it cannot be
# composed locally; point the suite at a running server instead.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:e2e
#   docker compose -f docker-compose.test.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sync_test
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync_test_password
    ports:
      - "127.0.0.1:5433:5432"  # Non-default port to avoid conflicts with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # RAM-backed for speed — data is ephemeral

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"  # Non-default port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
