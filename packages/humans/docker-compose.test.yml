# Docker Compose for sync engine E2E tests
#
# Starts the Node sync-server (apps/sync-server) + PostgreSQL + Redis so
# the SDK test suite can run real WebSocket + batchAck tests against a
# live server.
#
# Usage:
#   coding-workspace docker start  # in a managed Lobby workspace
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:e2e
# Set SYNC_PORT=8082 when running Auth on its default localhost:8081.
#   docker compose -f docker-compose.test.yml down -v
#
# Or in one shot: npm run test:e2e:run
# This stack uses disposable local credentials and pushes the current schema.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sync_test
      POSTGRES_USER: sync
      POSTGRES_PASSWORD: sync_test_password
    ports:
      - "127.0.0.1:5433:5432"  # Non-default port to avoid conflicts with local Postgres
      - "127.0.0.1:${SYNC_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # RAM-backed for speed — data is ephemeral

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"  # Non-default port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Use the same generated Prisma engine as the Syncserver build. The historical
  # migrations require Neon-only extensions and cannot initialize local Postgres.
  # ponytail: db push covers the current schema; use a migration replay image if
  # this test needs to verify historical migration behavior.
  migrate:
    build:
      context: ../..
      dockerfile: apps/sync-server/Dockerfile
      target: builder
    working_dir: /app/packages/database
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sync:sync_test_password@postgres:5432/sync_test?sslmode=disable
    command: ["npx", "prisma", "db", "push"]

  sync-server:
    # Plaintext database access is allowed only on loopback. Share Postgres's
    # network namespace instead of weakening the remote-database TLS policy.
    network_mode: service:postgres
    build:
      # apps/sync-server's Dockerfile COPYs sibling workspace packages
      # (packages/transaction, packages/humans, packages/database, …), so the build context
      # is the monorepo root, not the app dir.
      context: ../..
      dockerfile: apps/sync-server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # sync-server reads CONTROL_PLANE_DATABASE_URL (config.ts), while the
      # bundled Prisma client / Better Auth read DATABASE_URL. Point all at
      # the migrated test database.
      CONTROL_PLANE_DATABASE_URL: postgres://sync:sync_test_password@localhost:5432/sync_test?sslmode=disable
      SHARED_DATABASE_URL: postgres://sync:sync_test_password@localhost:5432/sync_test?sslmode=disable
      DATABASE_URL: postgres://sync:sync_test_password@localhost:5432/sync_test?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: "8080"
      # NODE_ENV != production enables testProvider, which authenticates from
      # X-User-Id / X-Organization-Id headers — the parity port of the Go
      # server's DISABLE_AUTH path the scoping E2E tests rely on. We omit
      # BETTER_AUTH_SECRET so the session-cookie provider stays off.
      NODE_ENV: development
    # No compose-level healthcheck: the node:24-slim image has no wget, and
    # the Dockerfile already defines a node-based HEALTHCHECK on /api/health
    # which `--wait` honours.
